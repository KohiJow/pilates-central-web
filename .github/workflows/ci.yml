name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: tipos, lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # o typecheck já rodou acima; aqui só o empacotamento. A configuração do projeto Firebase
      # vem das variáveis do repositório (ver docs/firebase.md); sem elas, o site sai só com a
      # demonstração.
      - run: npx vite build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 7

  regras:
    name: regras do firestore (emulador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # o emulador do Firestore roda em Java
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm i -g firebase-tools@15.31.0
      - run: npm run regras

  e2e:
    name: ponta a ponta (${{ matrix.projeto }})
    needs: verificar
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # chromium com o perfil do Pixel 7, webkit (motor do Safari) com o do iPhone 13
        projeto: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - run: npx playwright install --with-deps ${{ matrix.projeto }}
      # emuladores do Firebase (auth e Firestore, projeto demo-pilates) para os testes com o SDK
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm i -g firebase-tools@15.31.0
      - run: firebase emulators:exec --only auth,firestore --project demo-pilates "npx playwright test --project=${{ matrix.projeto }}"
        env:
          EMULADOR: '1'
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: relatorio-${{ matrix.projeto }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  publicar:
    name: publicar no GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [verificar, regras, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: publicacao
        uses: actions/deploy-pages@v5
