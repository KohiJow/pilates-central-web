<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aula experimental | Pilates Central</title>
    <meta name="description" content="Conheça o estúdio: escolha um horário com vaga e peça a sua aula experimental pelo WhatsApp." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F5F1EE" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%icones/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icones/apple-touch-icon.png" />
    <script>
      // aplica o tema salvo e a cor da barra do sistema antes da primeira pintura, para não piscar
      // claro no modo escuro (a barra seguia clara até o app carregar)
      var t = null
      try {
        t = localStorage.getItem('pc-tema')
      } catch (e) {}
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      if (t === 'dark' || (t !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1C120D')
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Para ver os horários, ative o JavaScript do navegador.</noscript>
    <script type="module" src="/src/experimental/main.tsx"></script>
  </body>
</html>
