<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pilates Central</title>
    <meta name="description" content="Agenda, presença e reposição do estúdio, direto no celular." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F5F1EE" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pilates Central" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%icones/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icones/apple-touch-icon.png" />
    <script>
      // aplica o tema salvo e a cor da barra do sistema antes da primeira pintura, para não piscar
      // claro no modo escuro (a barra seguia clara até o app carregar)
      var t = null
      try {
        t = localStorage.getItem('pc-tema')
      } catch (e) {}
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      if (t === 'dark' || (t !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1C120D')
      }
    </script>
  </head>
  <body>
    <!-- o logo no centro até o app carregar: continua a tela de abertura do iPhone sem salto -->
    <div id="app"><div class="abertura" aria-hidden="true"><span class="abertura-logo"></span></div></div>
    <noscript>Para usar o app, ative o JavaScript do navegador.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
